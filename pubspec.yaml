name: herfa
description: "Herfa - Production-grade offline-first Flutter application (Public Showcase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  dartz: ^0.10.1

  # Network & Storage
  dio: ^5.7.0
  uuid: ^4.5.1
  flutter_secure_storage: ^10.3.1

  # Routing & UI
  go_router: ^17.3.0
  intl: ^0.20.2

flutter:
  uses-material-design: true
